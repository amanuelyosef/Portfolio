<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#e2e8f0" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Clean Classic Light Architectural Canvas -->
  <rect width="800" height="500" fill="#f8fafc"/>
  <rect width="800" height="500" fill="url(#grid)" opacity="0.65"/>

  <!-- Top Category Strip -->
  <rect x="48" y="38" width="210" height="28" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="153" y="56" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2" fill="#1e40af" text-anchor="middle">AI &amp; LLM ORCHESTRATION</text>

  <text x="752" y="56" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#64748b" text-anchor="end">2023 – 2025 · AKS / KAFKA</text>

  <!-- Architecture Diagram Flow -->
  <g transform="translate(48, 96)">
    <!-- Node 1: Client & Events -->
    <rect x="0" y="36" width="152" height="84" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="76" y="64" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Learner Stream</text>
    <text x="76" y="84" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#475569" text-anchor="middle">2M+ Active Users</text>
    <text x="76" y="102" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#1d4ed8" text-anchor="middle">100k events/day</text>

    <!-- Arrow 1 -->
    <line x1="152" y1="78" x2="188" y2="78" stroke="#94a3b8" stroke-width="1.5"/>
    <polygon points="188,73 196,78 188,83" fill="#64748b"/>

    <!-- Node 2: Kafka + Cassandra -->
    <rect x="196" y="36" width="152" height="84" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="272" y="64" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Apache Kafka</text>
    <text x="272" y="84" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Event Pipeline</text>
    <text x="272" y="102" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#1d4ed8" text-anchor="middle">FastAPI + Cassandra</text>

    <!-- Arrow 2 -->
    <line x1="348" y1="78" x2="384" y2="78" stroke="#94a3b8" stroke-width="1.5"/>
    <polygon points="384,73 392,78 384,83" fill="#64748b"/>

    <!-- Node 3: BERT + Collab Filtering -->
    <rect x="392" y="36" width="152" height="84" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="468" y="64" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">BERT Recommender</text>
    <text x="468" y="84" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Collaborative Filter</text>
    <text x="468" y="102" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#1d4ed8" text-anchor="middle">PyTorch Inference</text>

    <!-- Arrow 3 -->
    <line x1="544" y1="78" x2="580" y2="78" stroke="#94a3b8" stroke-width="1.5"/>
    <polygon points="580,73 588,78 580,83" fill="#64748b"/>

    <!-- Node 4: GPT-4 + RAG -->
    <rect x="588" y="36" width="116" height="84" rx="8" fill="#0f1c2e" stroke="#0f1c2e" stroke-width="1.2"/>
    <text x="646" y="64" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">GPT-4 + RAG</text>
    <text x="646" y="84" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">AI Tutor Agent</text>
    <text x="646" y="102" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#93c5fd" text-anchor="middle">Azure AKS</text>
  </g>

  <!-- Summary Footer Card -->
  <rect x="48" y="268" width="704" height="190" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <rect x="48" y="268" width="4" height="190" rx="2" fill="#1e40af"/>

  <text x="76" y="314" font-family="'Georgia', 'Times New Roman', serif" font-size="30" font-weight="700" fill="#0f172a">LearnWise</text>
  <text x="76" y="344" font-family="'Inter', system-ui, sans-serif" font-size="14.5" fill="#475569">Adaptive Learning Platform — Personalized Curriculum Graph &amp; Agentic RAG Tutor</text>

  <line x1="76" y1="368" x2="724" y2="368" stroke="#f1f5f9" stroke-width="1.5"/>

  <!-- Metrics Strip -->
  <g transform="translate(76, 390)">
    <text x="0" y="16" font-family="'Georgia', serif" font-size="22" font-weight="700" fill="#1e40af">2M+</text>
    <text x="0" y="36" font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#64748b">Learners Served</text>

    <text x="190" y="16" font-family="'Georgia', serif" font-size="22" font-weight="700" fill="#0f172a">100k/day</text>
    <text x="190" y="36" font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#64748b">Kafka Event Stream</text>

    <text x="395" y="16" font-family="'Georgia', serif" font-size="22" font-weight="700" fill="#0f172a">99.9%</text>
    <text x="395" y="36" font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#64748b">AKS API Availability</text>

    <text x="570" y="16" font-family="'Georgia', serif" font-size="22" font-weight="700" fill="#0f172a">5 Eng</text>
    <text x="570" y="36" font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#64748b">Team Led</text>
  </g>
</svg>
